# Read by the systemd --user manager at login, so it reaches services that are
# NOT children of the compositor (XDG-autostart units, D-Bus activation).
# The compositor env blocks (niri config.kdl / hyprland.conf) only cover
# processes spawned by the compositor itself, which is why kdeconnectd came up
# with the default Qt palette instead of the wallust-tinted GTK3 one.
QT_QPA_PLATFORMTHEME=gtk3
