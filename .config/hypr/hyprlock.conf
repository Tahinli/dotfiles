# Hyprlock Configuration
# Lock screen with date/time display, password authentication, and music info

# Background image
background {
    path = ~/Pictures/ryunosuke-kikuno-VXp-9HwN1eg-unsplash.jpg
}

# Date label - displays current date in center
label {
    monitor =
    text = cmd[update:1000] echo -e "$(LC_TIME=en_GB.UTF-8 date +"%A, %B %d")"
    color = rgba(180, 200, 215, 0.90)
    font_size = 25
    font_family = SF Pro Display Semibold
    position = 0, 350
    halign = center
    valign = center
}

# Time label - displays current time in large format at center
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%H:%M:%S")</span>"
    color = rgba(180, 200, 215, 0.90)
    font_size = 120
    font_family = SF Pro Display Bold
    position = 0, 230
    halign = center
    valign = center
}

# Password input field with authentication status feedback
input-field {
    monitor =
    size = 280, 55
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = rgb(180, 200, 215)
    fade_on_empty = false
    font_family = SF Pro Display Bold
    placeholder_text = <i><span foreground="##b4c8d7">Password</span></i>
    hide_input = false
    position = 0, -210
    halign = center
    valign = center
    check_color = rgba(255, 223, 0, 1.0)
    fail_color = rgba(255, 71, 87, 1.0)
    fail_text = <i>Authentication Failed</i>
}

# Music info label - displays current playing song with duration from song_detail.sh script
label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/scripts/shared/song_detail.sh)"
    color = rgba(180, 200, 215, 0.75)
    font_size = 18
    font_family = JetBrains Mono Nerd, SF Pro Display Bold
    position = 0, 50
    halign = center
    valign = bottom
}
