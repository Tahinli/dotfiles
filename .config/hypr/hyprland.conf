monitor=,preferred,auto,auto
monitor = DP-1, 2560x1440@180, 0x0, 1, bitdepth, 10
monitor = HDMI-A-1, 1920x1080@75, 2560x0, 1, bitdepth, 10

exec-once = hyprpm reload -n
exec-once = sleep 1 && /usr/libexec/polkit-mate-authentication-agent-1
exec-once = bash ~/.config/scripts/shared/song_detail_writer.sh
exec-once = sleep 1 && waybar
exec-once = sleep 2 && nm-applet
exec-once = sleep 2 && blueman-applet
exec-once = sleep 2 && kdeconnect-indicator
exec-once = sleep 2 && hyprpaper
exec-once = sleep 3 && /opt/Mullvad\ VPN/mullvad-vpn
exec-once = sleep 3 && swaync-client -dn
exec-once = sleep 3 && wl-paste --type text --watch cliphist store
exec-once = sleep 3 && wl-paste --type image --watch cliphist store
exec-once = sleep 4 && rfkill unblock bluetooth && bluetoothctl power on
exec-once = sudo /usr/local/bin/asus-receiver-rebind

env = QT_QPA_PLATFORMTHEME,gtk3
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = PATH, $HOME/.cargo/bin/:$HOME/.local/bin/:$PATH
env = XDG_CURRENT_SESSION, Hyprland

$terminal = wezterm start --always-new-process
$fileManager = nautilus --new-window
$active_menu = rofi -show
$menu = rofi -show drun -show-icons
$menu_unsafe = mullvad-exclude rofi -show drun -show-icons
$clipboard =  cliphist list | rofi -dmenu -show-icons -i | cliphist decode | wl-copy
$screenshot = grim -t png - | tee "$HOME/Pictures/Screenshots/$(date '+%y%m%d_%H-%M-%S').png" | wl-copy -t image/png
$screenshot_with_area_selector = grim -t png -g "$(slurp)" - | wl-copy -t image/png
$power_menu = bash ~/.config/scripts/system/power_menu.sh
$browser = flatpak run io.github.ungoogled_software.ungoogled_chromium --enable-features=MiddleClickAutoscroll
$browser_unsafe = mullvad-exclude flatpak run org.chromium.Chromium --incognito --enable-features=MiddleClickAutoscroll,AllowLegacyMV2Extensions --disable-features=ExtensionManifestV2Unsupported,ExtensionManifestV2Disabled,ExtensionsManifestV3Only
$signal = flatpak run org.signal.Signal
$deezer = mullvad-exclude flatpak run io.github.ungoogled_software.ungoogled_chromium --no-first-run --app="https://deezer.com/" --class=chrome-deezer.com__-Default --name=chrome-deezer.com__-Default --user-data-dir=/home/tahinli/.var/app/io.github.ungoogled_software.ungoogled_chromium/data/web-app-hub/profiles/VjW8vTQ3
$mainMod = SUPER
$my_trigger = Alt
$monitor_left = DP-1
$monitor_right = HDMI-A-1

bind = $my_trigger, T, exec, $terminal
bind = $my_trigger, Q, exec, $fileManager
bind = Alt, F1, exec, $active_menu
bind = Alt, 1, exec, $active_menu
bind = Alt, F2, exec, $menu
bind = Alt, 2, exec, $menu
bind = Alt SHIFT, F2, exec, $menu_unsafe
bind = Alt SHIFT, 2, exec, $menu_unsafe
bind = Alt, F3, exec, $clipboard
bind = Alt, 3, exec, $clipboard
bind = , Print, exec, $screenshot
bind = $my_trigger, F, exec, $browser
bind = $my_trigger SHIFT, F, exec, $browser_unsafe
bind = Shift, Print, exec, $screenshot_with_area_selector
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, Escape, exec, $power_menu
bind = $mainMod, W, exec, ~/.config/scripts/hyprland/wallpaper_picker.sh
bind = $mainMod, M, exec, ~/.config/scripts/hyprland/toggle_monitors.sh
bindl = $mainMod SHIFT, M, exec, ~/.config/scripts/hyprland/toggle_monitors.sh on
bind = $mainMod SHIFT, K, exec, bash ~/.config/scripts/system/usb_menu.sh

$discord = flatpak run dev.vencord.Vesktop
$youtube = mullvad-exclude flatpak run io.freetubeapp.FreeTube
$code = zed
$mail = flatpak run io.github.ungoogled_software.ungoogled_chromium --no-first-run --app="https://mail.proton.me/" --class=chrome-mail.proton.me__-Default --name=chrome-mail.proton.me__-Default --user-data-dir=/home/tahinli/.var/app/io.github.ungoogled_software.ungoogled_chromium/data/web-app-hub/profiles/eIpzVtL8
$whatsapp = mullvad-exclude flatpak run io.github.ungoogled_software.ungoogled_chromium --no-first-run --app="https://web.whatsapp.com/" --class=chrome-web.whatsapp.com__-Default --name=chrome-web.whatsapp.com__-Default --user-data-dir=/home/tahinli/.var/app/io.github.ungoogled_software.ungoogled_chromium/data/web-app-hub/profiles/aW2IMaZ8
$github = flatpak run io.github.ungoogled_software.ungoogled_chromium --no-first-run --app="https://github.com/" --class=chrome-github.com__-Default --name=chrome-github.com__-Default --user-data-dir=/home/tahinli/.var/app/io.github.ungoogled_software.ungoogled_chromium/data/web-app-hub/profiles/FCF18Wmt

workspace = 100, on-created-empty: $code
workspace = 200, on-created-empty: $github
workspace = 201, on-created-empty: $whatsapp
workspace = 202, on-created-empty: $discord
workspace = 203, on-created-empty: $deezer
workspace = 204, on-created-empty: $youtube
workspace = 205, on-created-empty: $mail
workspace = 206, on-created-empty: $signal

bind = $my_trigger, C, workspace, 100
bind = $my_trigger, G, workspace, 200
bind = $my_trigger, W, workspace, 201
bind = $my_trigger, D, workspace, 202
bind = $my_trigger, S, workspace, 203
bind = $my_trigger, Y, workspace, 204
bind = $my_trigger, P, workspace, 205
bind = $my_trigger, N, workspace, 206

bind = $mainMod SHIFT, C, movetoworkspace, 100
bind = $mainMod SHIFT, W, movetoworkspace, 201
bind = $mainMod SHIFT, D, movetoworkspace, 202
bind = $mainMod SHIFT, Y, movetoworkspace, 204
bind = $mainMod SHIFT, P, movetoworkspace, 205
bind = $mainMod SHIFT, N, movetoworkspace, 206

bind = $mainMod, D, exec, ~/.config/scripts/hyprland/show_desktop.sh

bind = Alt, F4, killactive,
bind = Alt, 4, killactive,
bind = $mainMod $my_trigger, F4, exit,
bind = $mainMod, H, exec, pkill -SIGUSR1 waybar
binds {
	allow_workspace_cycles = true
}
bindr = $mainMod, Tab, bringactivetotop
bind = $mainMod, Tab, cyclenext
bind = Alt, Tab, workspace, previous_per_monitor
bind = $mainMod SHIFT, Tab, split:swapactiveworkspaces, $monitor_left $monitor_right
bind = $mainMod, P, pseudo,
bind = $mainMod, J, layoutmsg, togglesplit
bind = $mainMod, F, togglefloating,
bind = $mainMod, Q, focusmonitor, $monitor_left
bind = $mainMod, E, focusmonitor, $monitor_right
bind = $mainMod SHIFT, Q, movewindow, mon:$monitor_left
bind = $mainMod SHIFT, E, movewindow, mon:$monitor_right
bind = $mainMod, I, split:grabroguewindows,
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod CTRL, left, swapwindow, l
bind = $mainMod CTRL, right, swapwindow, r
bind = $mainMod CTRL, up, swapwindow, u
bind = $mainMod CTRL, down, swapwindow, d

bind = $mainMod, 1, split:workspace, 1
bind = $mainMod, 2, split:workspace, 2
bind = $mainMod, 3, split:workspace, 3
bind = $mainMod, 4, split:workspace, 4
bind = $mainMod, 5, split:workspace, 5
bind = $mainMod, 6, split:workspace, 6
bind = $mainMod, 7, split:workspace, 7
bind = $mainMod, 8, split:workspace, 8
bind = $mainMod, 9, split:workspace, 9
bind = $mainMod, 0, split:workspace, 10

bind = $mainMod SHIFT, 1, split:movetoworkspace, 1
bind = $mainMod SHIFT, 2, split:movetoworkspace, 2
bind = $mainMod SHIFT, 3, split:movetoworkspace, 3
bind = $mainMod SHIFT, 4, split:movetoworkspace, 4
bind = $mainMod SHIFT, 5, split:movetoworkspace, 5
bind = $mainMod SHIFT, 6, split:movetoworkspace, 6
bind = $mainMod SHIFT, 7, split:movetoworkspace, 7
bind = $mainMod SHIFT, 8, split:movetoworkspace, 8
bind = $mainMod SHIFT, 9, split:movetoworkspace, 9
bind = $mainMod SHIFT, 0, split:movetoworkspace, 10

bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

bind = $mainMod, mouse_down, split:workspace, e+1
bind = $mainMod, mouse_up, split:workspace, e-1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindle = $mainMod SHIFT, right, resizeactive, 30 0
bindle = $mainMod SHIFT, left, resizeactive, -30 0
bindle = $mainMod SHIFT, up, resizeactive, 0 -30
bindle = $mainMod SHIFT, down, resizeactive, 0 30

bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

windowrule = match:class .*, suppress_event maximize
windowrule = match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0, no_focus on
windowrule = match:class kitty, opacity 0.8
windowrule = match:class .*wezterm.*, opacity 0.8
windowrule = match:class .*dev.heppen.webapps.*, tile on

windowrule = match:fullscreen 1, immediate on
windowrule = match:class dev.zed.Zed, immediate off

general {
    gaps_in = 3
    gaps_out = 10

    border_size = 2

    col.active_border = rgba(FFAA93FF) rgba(0053DFEE) rgba(5500FFAA) rgba(FFAFFAAA) 0deg
    col.inactive_border = rgba(595959aa)

    resize_on_border = true

    allow_tearing = true

    layout = dwindle
}

render {
    direct_scanout = 0
}

decoration {
    rounding = 0

    active_opacity = 1.0
    inactive_opacity = 1.0

    blur {
        enabled = false
        size = 3
        passes = 1

        vibrancy = 0.1696
    }

}

animations {
    enabled = false
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    vrr = 0
    mouse_move_focuses_monitor = false
}

debug {
    disable_logs = true
    enable_stdout_logs = false
}

input {
    kb_layout = tr
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 0
    mouse_refocus = false
    accel_profile = flat

    sensitivity = 0

    touchpad {
        natural_scroll = true
    }
}

device {
    name = epic-mouse-v1
    sensitivity = 0
}
