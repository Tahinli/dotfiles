asc=no
ao=alsa
audio-device=alsa/pipewire

# GPU decode via VA-API on the RX 9060 XT (gfx1200/VCN 5.0): h264, hevc
# (incl. Main10), vp9 (incl. profile2) and av1 all decode in hardware.
#
# Pinned to vaapi rather than auto-safe on purpose. auto-safe prefers Vulkan
# Video, and radv's AV1 decode hangs the VCN block on this card — every AV1
# file faults with VK_ERROR_DEVICE_LOST and the kernel has to reset
# vcn_unified_0 to recover. vaapi decodes the same files cleanly. Retry
# auto-safe after a Mesa bump; if AV1 plays, the pin can be dropped.
hwdec=vaapi

# Let the compositor own the window size. Without this mpv keeps the window at
# the video's aspect ratio, deriving height from whatever width it is given —
# under niri that makes the window taller than its tile and pushes the OSC
# controls off screen. Hyprland forced the size instead, which is why this only
# appeared after the switch. Video is letterboxed inside the tile now.
keepaspect-window=no
